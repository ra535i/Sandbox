replicaCount: 1
appName: sandbox-app
hostname: sethsandbox.com

image:
  repository: localhost:5000/sandbox-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 80

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

environment: dev
